name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  coverage:
    permissions:
      contents: write
    name: Generate coverage badge
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test ./... -coverprofile=cover.out -covermode=set

      - name: Generate coverage badge
        uses: vladopajic/go-test-coverage@c9e33f3e5bf5a0a846ac3b2f89608a970ad5e685 # v2.11.0
        with:
          profile: cover.out
          local-prefix: io.musil/mink
          threshold-file: 0
          threshold-package: 0
          threshold-total: 8
          git-branch: badges
          git-token: ${{ github.token }}
