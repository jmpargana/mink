# This rule is not used by the project mink itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mink.io.musil.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mink
    app.kubernetes.io/managed-by: kustomize
  name: topic-editor-role
rules:
- apiGroups:
  - mink.io.musil
  resources:
  - topics
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mink.io.musil
  resources:
  - topics/status
  verbs:
  - get
