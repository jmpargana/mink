apiVersion: v1
kind: Service
metadata:
  name: {{ include "mink.fullname" . }}
  labels:
    {{- include "mink.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "mink.selectorLabels" . | nindent 4 }}
